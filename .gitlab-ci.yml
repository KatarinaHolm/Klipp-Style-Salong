# Use the official .NET 10 SDK image
image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  # Berätta för NuGet var lokala paket ska sparas så de kan sparas i cache
  NUGET_PACKAGES_DIRECTORY: .nuget/packages

cache:
  # Definiera vilken mapp som ska sparas mellan körningar
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages

# Define the order of stages
stages:
  - build
  - test
  - publish

# Define a job for the build stage
build_project:
  stage: build
  script:
    - echo "Building the .NET project..."
    - dotnet build

# Define a job for the test stage
test_project:
  stage: test
  script:
    - echo "Running tests..."
    - dotnet test --collect:"XPlat Code Coverage"

# Define a job for the publish stage
publish_project:
  stage: publish
  script:
    - echo "Publishing the application in Release mode..."
    - dotnet publish "Klipp&StyleSalong.csproj" -c Release -o ./publish
  artifacts:
    paths:
      - ./publish 
    expire_in: 1 week

    #deploy
deploy_to_azure:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:10.0 # Du kan använda samma image
  before_script:
    # Vi behöver installera zip, curl är ofta redan installerat
    - apt-get update && apt-get install -y zip curl
  script:
    - echo "Zippar ihop applikationen..."
    - cd publish
    - zip -r ../app.zip .
    - cd ..
    - echo "Skickar till Azure..."
    - curl -X POST -u $AZURE_PUBLISH_USERNAME:$AZURE_PUBLISH_PASSWORD --data-binary @"app.zip" $AZURE_WEBAPP_URL
  only:
    - main # Deployar enbart när du pushar till main-branchen
